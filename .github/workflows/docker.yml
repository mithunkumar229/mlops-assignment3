name: Docker Build and Push

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/mithunkumar229/mlops-a3-inference:latest" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: mithunkumar229
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg HF_MODEL_NAME=Mithunkumar229/distilbert-emotion-mlops-a3 \
            -t $IMAGE_NAME .

      - name: Test Docker image
        run: |
          docker run --rm \
            -e INPUT_TEXT="I am very happy today" \
            $IMAGE_NAME

      - name: Push Docker image
        run: docker push $IMAGE_NAME
